image:
  registry: oci.messier42.com
  repository: cabe/khaled
  tag: dev
  pullPolicy: IfNotPresent
imagePullSecrets: []
rbac:
  podRead:
    enabled: false
config:
  keyStorage:
    use: disk
    disk:
      path: /var/lib/khaled
  policyEngine:
    use: cedar
  policySource:
    use: inline
    inline:
      text: |
        permit(principal, action, resource);
  clientAuthn:
    use: tls-spiffe
  claimsMapping:
    use: static
    static:
      principals:
        - uri: ".*"
          claims: {}
  spiffe:
    workloadSocketPath: /spiffe-workload-api/socket
  logging:
    format: json
    severity: info
  listeners:
    - use: http
      address: "0.0.0.0:8443"
      http:
        tls:
          serverCertificate:
            source: spiffe
  monitoring:
    # Plaintext HTTP listener for /livez and /readyz. The probes
    # defined on the StatefulSet below point at this port. Set the
    # address to "" to disable the monitoring listener and the probes.
    address: "0.0.0.0:8081"
    shutdownWarningTime: "5s"
