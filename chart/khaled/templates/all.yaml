---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: khaled
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: khaled-pod-read
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: khaled-pod-read
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
subjects:
  - kind: ServiceAccount
    name: khaled
    namespace: khaled
roleRef:
  kind: ClusterRole
  name: khaled-pod-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: khaled-config-read
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["khaled-config"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: khaled-config-read
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
subjects:
  - kind: ServiceAccount
    name: khaled
    namespace: khaled
roleRef:
  kind: Role
  name: khaled-config-read
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: khaled-config
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
data:
  khaled.yaml: |
{{ toYaml .Values.config | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: khaled
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
spec:
  replicas: 1
  serviceName: khaled
  selector:
    matchLabels:
      app.kubernetes.io/name: khaled
  template:
    metadata:
      labels:
        app.kubernetes.io/name: khaled
    spec:
      serviceAccountName: khaled
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: khaled
          image: "{{ if .Values.image.registry }}{{ .Values.image.registry }}/{{ end }}{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"
          securityContext:
            capabilities:
              drop: ["ALL"]
            privileged: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          env:
            - name: KHALED_CONFIG_SOURCE
              value: k8s
            - name: KHALED_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KHALED_K8S_CONFIG
              value: configmap/khaled-config
            - name: PATH
              value: /bin
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            {{- if .Values.config.monitoring.address }}
            - name: monitoring
              containerPort: {{ (splitList ":" .Values.config.monitoring.address) | last }}
              protocol: TCP
            {{- end }}
          {{- if .Values.config.monitoring.address }}
          # Kubernetes probes target the plaintext monitoring listener.
          # startupProbe gates liveness/readiness until the process is
          # serving, tolerating a slow first start (e.g. a slow SPIFFE
          # source) for up to 60s. livenessProbe restarts a wedged
          # process; readinessProbe drains the pod from the Service
          # whenever a subsystem is not ready.
          startupProbe:
            httpGet:
              path: /livez
              port: monitoring
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /livez
              port: monitoring
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: monitoring
            periodSeconds: 5
          {{- end }}
          resources: {}
          volumeMounts:
            - name: data
              mountPath: /var/lib/khaled
              readOnly: false
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: khaled
  namespace: khaled
  labels:
    app.kubernetes.io/name: khaled
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
  selector:
    app.kubernetes.io/name: khaled
